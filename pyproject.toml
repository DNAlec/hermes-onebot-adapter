[build-system]
requires = ["setuptools>=81", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-onebot-adapter"
dynamic = ["version"]
description = "OneBot 11 adapter service for Hermes Agent (NapCat / go-cqhttp)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Alec" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Communications :: Chat",
]
keywords = ["onebot", "qq", "hermes", "napcat", "chatbot", "onebot11"]
dependencies = [
    "aiohttp>=3.10,<4",
    "packaging>=23",
    "pydantic>=2,<3",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/DNAlec/hermes-onebot-adapter"

[tool.setuptools_scm]
write_to = "onebot_adapter/_version_scm.py"
write_to_template = "__version__ = \"{version}\"\n"

[project.scripts]
hermes-onebot-adapter = "onebot_adapter.__main__:main"

[tool.setuptools.packages.find]
include = ["onebot_adapter*"]

[tool.setuptools.package-data]
"onebot_adapter.webui.static" = ["**/*"]
"onebot_adapter.hermes_plugin" = ["*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
# Start with a pragmatic ceiling that blocks monolithic parser/dispatcher
# functions without forcing unrelated legacy hotspots into the same change.
max-complexity = 20

[tool.ruff.lint.pylint]
max-branches = 40
max-statements = 100
